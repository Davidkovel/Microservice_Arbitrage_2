services:
  fetcher-instance-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: price-instance-1
    volumes:
      - ./config/tokens1.json:/app/config/tokens1.json
    environment:
      - PROXY_URL=${PROXY_URL_1}
      - PROXY_LOGIN=${PROXY_LOGIN_1}
      - PROXY_PASSWORD=${PROXY_PASSWORD_1}
      - TOKENS_PATH=${TOKENS_FILE_PATH_1}
      - KAFKA_SERVER_HOST=${KAFKA_SERVER_HOST_1}

  fetcher-instance-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: price-instance-2
    volumes:
      - ./config/tokens2.json:/app/config/tokens2.json
    environment:
      - PROXY_URL=${PROXY_URL_2}
      - PROXY_LOGIN=${PROXY_LOGIN_2}
      - PROXY_PASSWORD=${PROXY_PASSWORD_2}
      - TOKENS_PATH=${TOKENS_FILE_PATH_2}
      - KAFKA_SERVER_HOST=${KAFKA_SERVER_HOST_2}

